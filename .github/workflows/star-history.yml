name: Star History
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'vanzll/DiffusionART'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install matplotlib==3.10.9
      - run: python scripts/update_star_history.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: star-history
          path: .star-history
      - name: Publish chart to its dedicated branch
        run: |
          cp assets/readme/star-history-{light,dark}.svg assets/readme/star-history.json .star-history/
          cd .star-history
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add star-history-*.svg star-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Star History chart'
          git pull --rebase origin star-history
          git push origin HEAD:star-history
