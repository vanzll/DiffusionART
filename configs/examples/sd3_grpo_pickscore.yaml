extends: sd3_fast_pickscore.yaml
name: sd35-grpo-pickscore-integration
algorithm:
  name: flow_grpo
  options:
    loss: {ratio_clip: 0.00001, advantage_clip: 5.0}
    updates_per_rollout: 2
    training_batches: 4
    shuffle_rows: true
    zero_advantage_mode: filter_pad
    max_empty_rollouts: 100
    evaluation_ema: {enabled: true, decay: 0.9, refresh: logical_batch}
sampling:
  options:
    transition_kind: sde
    likelihood: gaussian
    selection: fixed
    pool: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    count: 9
    unselected_noise: all
runtime:
  output_dir: outputs/sd35-grpo-pickscore-integration
