# 480p / ten actual Euler transitions / fixed five-second training only.
# Full32 uses rollout8/update4 after the original update8 backward OOM.
# Full64 and LoRA8 explicitly override their update microbatches.
extends: minimax_h3_art_full_32gpu.yaml
name: minimax-h3-art-posttrain-full-32gpu
algorithm:
  options:
    post_training:
      video_pool: 4
      audio_pool: 3
      count: 2
      reward_normalization: prompt_group_std
      eval_gallery: true
      duration_frames: [124]
      full_duration_rewards: true
    loss:
      reference_mse_beta: 0.001
sampling:
  # Native scheduler counts boundaries including zero: 11 points = 10 forwards.
  steps: 11
  height: 480
  width: 864
  frames: 124
reward:
  weights:
    video_align: 1.0
    hpsv3: 1.5
    audiobox: 0.5
    clap: 1.0
    desync: 1.0
    imagebind: 0.5
data:
  manifest: ${H3_OMNINFT_DATA_ROOT}/train.jsonl
  sha256: 29c004c3927c34663ee8f95ad1b34b1bce7c91c95f86af18724627324e82699d
training:
  microbatch: 4
  max_updates: 400
evaluation:
  # Disabled at startup, all intermediate boundaries, resume and completion.
  every_updates: 0
  every_rollouts: 0
  at_updates: []
  # Bind the later offline protocol now so enabling only its cadence preserves
  # the checkpoint resume signature. No evaluation dataset is loaded in training.
  manifest: ${H3_OMNINFT_DATA_ROOT}/test.jsonl
  manifest_sha256: e0e6b9f2451e2089582121436f6a8b7b539920b671e0ae9ba1587f86c83785a4
  sampling_steps: 50
  height: 768
  width: 1344
  seed: 42
  retain_all: true
runtime:
  output_dir: ${H3_OUTPUT_DIR}
  checkpoint_every: 50
  checkpoint_keep: 2
  log: wandb
  wandb:
    project: diffusionart-minimax-h3
    name: minimax-h3-art-six-reward-480p-10steps-v4a3-124frames-refmse1e-3-trainonly-full32
