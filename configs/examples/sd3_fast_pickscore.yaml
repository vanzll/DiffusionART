# Native single-device integration check, NOT a paper reproduction recipe.
name: sd35-fast-pickscore-integration
task: t2i
seed: 42
algorithm:
  name: flow_grpo_fast
  options:
    loss: {ratio_clip: 0.00001, advantage_clip: 5.0}
    updates_per_rollout: 2
    training_batches: 4
    shuffle_rows: false
    zero_advantage_mode: filter_pad
    max_empty_rollouts: 100
    evaluation_ema: {enabled: true, decay: 0.9, refresh: logical_batch}
model:
  name: sd3
  checkpoint: stabilityai/stable-diffusion-3.5-medium
  revision: b940f670f0eda2d07fbb75229e779da1ad11eb80
  options:
    local_files_only: true
    scaling_factor: 1.5305
    shift_factor: 0.0609
    latent_channels: 16
    spatial_factor: 8
    max_sequence_length: 128
    gradient_checkpointing: true
    decode_microbatch: 1
    finetune:
      mode: lora
      rank: 32
      alpha: 64
      target_modules:
        - attn.add_k_proj
        - attn.add_q_proj
        - attn.add_v_proj
        - attn.to_add_out
        - attn.to_k
        - attn.to_out.0
        - attn.to_q
        - attn.to_v
reward:
  name: pickscore
  checkpoint: yuvalkirstain/PickScore_v1
  revision: a4e4367c6dfa7288a00c550414478f865b875800
  normalization: fixed
  weights: {pickscore: 1.0}
  options:
    local_files_only: true
    processor: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
    processor_revision: 1c2b8495b28150b8a4922ee1c8edee224c284c0c
    microbatch: 1
data:
  manifest: configs/examples/image_prompts.jsonl
  sha256: 923ffe4cfbf8b780f896a491f3faeb024e1e85e2850a96a39ffb5dcd7a6cd233
  shuffle: true
sampling:
  steps: 10
  prompts_per_rollout: 2
  samples_per_prompt: 4
  microbatch: 1
  guidance_scale: 1.0
  height: 512
  width: 512
  frames: 1
  fps: 1.0
  options:
    shift: 3.0
    transition_kind: cps
    likelihood: mse
    noise_level: 0.8
    selection: contiguous
    pool: [0, 1, 2, 3, 4]
    count: 3
    logical_batch_size: 4
    unselected_noise: ode
training:
  max_updates: 4
  learning_rate: 0.00001
  microbatch: 1
  precision: bf16
  grad_clip: 1.0
evaluation:
  every_updates: 2
  manifest: configs/examples/image_prompts.jsonl
  manifest_sha256: 923ffe4cfbf8b780f896a491f3faeb024e1e85e2850a96a39ffb5dcd7a6cd233
  sampling_steps: 10
  retain_all: true
  fps: 1.0
runtime:
  output_dir: outputs/sd35-fast-pickscore-integration
  device: cuda
  distributed: none
  checkpoint_every: 2
  log: jsonl
provenance:
  kind: native_integration_example_not_paper_result
