# Match current 480p Flash; use Flow-SDE/Gaussian and routed PPO ratios.
# This is separate from the archived 768p/multi-duration Fast profile.
extends: minimax_h3_art_posttrain_full_32gpu.yaml
name: minimax-h3-fast-sde-routed-480p-full-32gpu
algorithm:
  name: flow_grpo_fast
  options:
    ratio_mode: per_modality
    post_training:
      video_pool: 4
      audio_pool: 3
      count: 2
      reward_normalization: prompt_group_std
      eval_gallery: true
      duration_frames: [124]
      full_duration_rewards: true
    loss:
      ratio_clip: 0.0001
      advantage_clip: 5.0
      reference_mse_beta: 0.001
sampling:
  options:
    transition_kind: sde
runtime:
  wandb:
    name: minimax-h3-fast-sde-routed-six-reward-480p-10steps-v4a3-124frames-refmse1e-3-trainonly-full32
provenance:
  algorithm_variant: routed_high_noise_flow_sde_gaussian
