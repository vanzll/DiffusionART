# Match the six-reward ART recipe; change only the explicit algorithm variant.
extends: minimax_h3_art_posttrain_multiduration_32gpu.yaml
name: minimax-h3-fast-routed-posttrain-full-32gpu
algorithm:
  name: flow_grpo_fast
  options:
    ratio_mode: per_modality
    post_training:
      video_pool: 15
      audio_pool: 10
      count: 2
      reward_normalization: prompt_group_std
      eval_gallery: true
      duration_frames: [124, 243, 345]
      full_duration_rewards: true
    loss:
      ratio_clip: 0.0001
      advantage_clip: 5.0
      reference_mse_beta: 0.001
runtime:
  wandb:
    name: minimax-h3-fast-routed-six-reward-v15a10-mixed-duration-refmse1e-3-full32
provenance:
  algorithm_variant: routed_high_noise_cps
