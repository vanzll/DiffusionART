# Native DanceGRPO stochastic transitions and componentwise clipped objectives.
extends: hunyuan_art.yaml
name: hunyuan-dance-integration
algorithm:
  name: dancegrpo
  options:
    loss: {ratio_clip: 0.0001, advantage_clip: 5.0}
    advantage_epsilon: 0.00000001
reward:
  weights: {VQ: 0.5, MQ: 0.5, TA: 0.0}
sampling:
  options:
    noise_level: 0.25
runtime:
  output_dir: outputs/hunyuan-dance-integration
