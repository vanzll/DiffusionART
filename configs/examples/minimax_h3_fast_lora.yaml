# Native reference inference; optimizer budgets remain bounded integration defaults.
extends: ../inference/minimax_h3.yaml
name: minimax-h3-fast-lora-integration
task: t2av
seed: 42
algorithm:
  name: flow_grpo_fast
  options:
    loss:
      ratio_clip: 0.0001
      advantage_clip: 5.0
    advantage_epsilon: 0.0001
model:
  name: minimax_h3
  checkpoint: ${H3_MODEL}
  revision: 42ed227ee7df40d41602854ae760620d6eb651fe
  options:
    finetune:
      mode: lora
      rank: 64
      alpha: 128
      target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0
      - ff.net.0.proj
      - ff.net.2
    gradient_checkpointing: true
    local_files_only: true
    conditioning_device: cpu
    ffmpeg: ffmpeg
    ffprobe: ffprobe
reward:
  name: audio_video
  normalization: raw
  weights:
    video_align: 1.0
    hpsv3: 1.5
    audiobox: 0.5
    clap: 1.0
    desync: 1.0
  options:
    manifest: ${H3_REWARD_MANIFEST}
data:
  manifest: ${H3_TRAIN_MANIFEST}
  sha256: ${H3_TRAIN_SHA256}
  shuffle: true
sampling:
  prompts_per_rollout: 32
  samples_per_prompt: 8
  microbatch: 1
  options:
    noise_level: 0.8
    window_size: 3
    window_range:
    - 0
    - 8
    window_seed: 42
training:
  max_updates: 8
  learning_rate: 1.0e-05
  microbatch: 1
  precision: bf16
  grad_clip: 1.0
  weight_decay: 0.0001
evaluation:
  every_updates: 0
runtime:
  output_dir: outputs/minimax-h3-fast-lora
  device: cuda
  distributed: fsdp
  checkpoint_every: 2
  log: jsonl
provenance:
  kind: software_integration_acceptance_not_paper_result
  learning_rate: 1e-5 shared software acceptance choice; not upstream Fast LoRA 3e-4
  sampling_grid: native reference inference, 50 sigma boundaries = 49 transitions
  nft_semantics: repository routed mirror/slow-EMA; not upstream original OmniNFT
    config
