# Gaussian sparse Flow-SDE, not image Fast-CPS. No policy or evaluation EMA.
extends: hunyuan_art.yaml
name: hunyuan-fast-integration
algorithm:
  name: flow_grpo_fast
  options:
    loss: {ratio_clip: 0.00001, advantage_clip: 5.0}
    advantage_epsilon: 0.0001
reward:
  weights: {VQ: 0.5, MQ: 0.5, TA: 0.0}
sampling:
  options:
    train_timestep_count: 2
    train_timestep_pool: [0, 1, 2, 3, 4, 5]
    noise_level: 0.8
runtime:
  output_dir: outputs/hunyuan-fast-integration
