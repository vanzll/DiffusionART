# Small native integration example, not the paper's distributed GenEval profile.
extends: flux_grpo_pickscore.yaml
name: flux-fast-pickscore-integration
algorithm:
  name: flow_grpo_fast
  options:
    loss: {ratio_clip: 0.00001, advantage_clip: 5.0}
    updates_per_rollout: 2
    training_batches: 4
    shuffle_rows: false
    zero_advantage_mode: filter_pad
    max_empty_rollouts: 100
    evaluation_ema: {enabled: true, decay: 0.9, refresh: logical_batch}
sampling:
  options:
    transition_kind: cps
    likelihood: mse
    noise_level: 0.8
    selection: contiguous
    pool: [0, 1, 2]
    count: 3
    unselected_noise: ode
runtime:
  output_dir: outputs/flux-fast-pickscore-integration
