# Full-budget training candidate; not certified historical reproduction.
extends: ["../../examples/sd3_nft_pickscore.yaml","../geneval-assets.yaml","../sd3-model-assets.yaml"]
name: paper-sd3_geneval_nft_ema-candidate
seed: 42
algorithm:
  name: diffusionnft
  options:
    loss:
      nft_beta: 1
      adv_clip_max: 5
      adv_mode: all
      eps: 1.0e-05
    old_policy:
      rate: 0.001
      maximum: 0.5
      delay: 0
    evaluation_ema:
      enabled: true
      decay: 0.9
model:
  name: sd3
  checkpoint: ${SD3_MODEL}
  revision: b940f670f0eda2d07fbb75229e779da1ad11eb80
reward:
  name: geneval
  checkpoint: ${GENEVAL_MANIFEST}
  revision: ${GENEVAL_MANIFEST_SHA256}
  normalization: raw
  weights:
    geneval: 1
  options:
    worker_python: ${GENEVAL_PYTHON}
    microbatch: 1
    detector_microbatch: 1
    color_workers: 0
    startup_timeout: 300
    request_timeout: 300
data:
  manifest: ${GENEVAL_TRAIN_MANIFEST}
  sha256: ${GENEVAL_TRAIN_SHA256}
  shuffle: true
sampling:
  steps: 10
  prompts_per_rollout: 48
  samples_per_prompt: 24
  microbatch: 9
  guidance_scale: 1
  height: 512
  width: 512
  options:
    shift: 3
    solver: dpm2
    train_timestep_count: 9
    timestep_selection: random_per_row
training:
  max_updates: 1000
  learning_rate: 0.0003
  microbatch: 9
  precision: fp16
  allow_tf32: true
  grad_clip: 1
  optimizer: adamw
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
evaluation:
  every_updates: 0
  at_updates:
  - 30
  - 60
  - 90
  - 120
  - 150
  - 180
  - 210
  - 240
  - 270
  - 300
  - 330
  - 360
  - 390
  - 420
  - 450
  - 480
  - 510
  - 540
  - 570
  - 600
  - 630
  - 660
  - 690
  - 720
  - 750
  - 780
  - 810
  - 840
  - 870
  - 900
  - 930
  - 960
  - 990
  manifest: ${GENEVAL_EVAL_MANIFEST}
  manifest_sha256: ${GENEVAL_EVAL_SHA256}
  sampling_steps: 40
  height: 512
  width: 512
  seed: 42
runtime:
  log: wandb
  output_dir: ${PAPER_OUTPUT_ROOT}/sd3_geneval_nft_ema
  device: cuda
  distributed: ddp
  checkpoint_every: 200
  checkpoint_at_updates:
  - 100
  - 200
  - 300
  - 400
  - 500
  - 600
  - 700
  - 800
  - 900
  - 1000
provenance:
  kind: training_candidate_not_fullhistorical_reproduction
  source_run: 7zirilwj
  source_url: https://wandb.ai/stableNFT-baselines/baselines/runs/7zirilwj
  runtime_commit: null
  runtime_source_status: unresolved
  research_reference_commit: 3ca2a36f6b20c53a06813013234666d9c033a660
  archived_model: stabilityai/stable-diffusion-3.5-medium
  archived_model_revision: main
  source_world_size: 8
  source_train_batch_size: 9
  source_num_batches_per_epoch: 16
  source_gradient_accumulation_steps: 16
  source_updates_per_rollout: 1
  candidate_updates_per_rollout: 1
  source_timestep_fraction: 0.99
  source_sde_type: sde
  source_logprob_type: gaussian
  source_global_std: true
  source_same_latent: false
  source_resume_global_step: 0
  budget_basis: 1000_successful_updates_plotted_horizon_candidate
  cadence_basis: archived_eval_freq_epochs_times_candidate_updates_per_rollout
  semantic_gaps:
  - Prompt-major local groups replace historical DistributedKRepeatSampler shuffled mixed rows; exact
    order and RNG parity pending.
  - Model/reward revisions and text/LoRA asset conventions are release example pins, not recovered historical
    artifact hashes.
  - 1000 successful optimizer updates are the plotted-horizon training candidate; historical W&B indexing/overflow/overshoot
    parity is not certified.
  - NFT backend performs one global-rollout update; archived gradient_accumulation_steps is retained as
    evidence, not an exact trainer scheduling guarantee.
  - EMA decay/refresh defaults are mapped from research 3ca2a36f; historical runtime implementations remain
    unresolved.
  source_decay_type: 1
  source_nft_beta: 1
