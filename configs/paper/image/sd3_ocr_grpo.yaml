# Full-budget training candidate; not certified historical reproduction.
extends: ["../../examples/sd3_grpo_pickscore.yaml","../ocr-assets.yaml"]
name: paper-sd3_ocr_grpo-candidate
seed: 42
algorithm:
  name: flow_grpo
  options:
    loss:
      ratio_clip: 1.0e-05
      advantage_clip: 5
    updates_per_rollout: 2
    training_batches: 16
    shuffle_rows: true
    zero_advantage_mode: filter_pad
    max_empty_rollouts: 100
    evaluation_ema:
      enabled: true
      decay: 0.9
      refresh: logical_batch
model:
  name: sd3
  checkpoint: ${SD3_MODEL}
  revision: b940f670f0eda2d07fbb75229e779da1ad11eb80
reward:
  name: ocr
  checkpoint: ${OCR_MANIFEST}
  revision: ${OCR_MANIFEST_SHA256}
  normalization: raw
  weights:
    ocr: 1
  options:
    microbatch: 1
    error_policy: zero
data:
  manifest: ${OCR_TRAIN_MANIFEST}
  sha256: ${OCR_TRAIN_SHA256}
  shuffle: true
sampling:
  steps: 10
  prompts_per_rollout: 48
  samples_per_prompt: 24
  microbatch: 9
  guidance_scale: 1
  height: 512
  width: 512
  options:
    shift: 3
    transition_kind: sde
    likelihood: gaussian
    noise_level: 0.8
    selection: fixed
    pool:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    count: 9
    logical_batch_size: 9
    unselected_noise: all
training:
  max_updates: 1000
  learning_rate: 0.0003
  microbatch: 9
  precision: fp16
  allow_tf32: true
  grad_clip: 1
  optimizer: adamw
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
evaluation:
  every_updates: 50
  at_updates: []
  manifest: ${OCR_EVAL_MANIFEST}
  manifest_sha256: ${OCR_EVAL_SHA256}
  sampling_steps: 40
  height: 512
  width: 512
  seed: 42
runtime:
  log: wandb
  output_dir: ${PAPER_OUTPUT_ROOT}/sd3_ocr_grpo
  device: cuda
  distributed: ddp
  checkpoint_every: 200
  checkpoint_at_updates:
  - 100
  - 200
  - 300
  - 400
  - 500
  - 600
  - 700
  - 800
  - 900
  - 1000
provenance:
  kind: training_candidate_not_fullhistorical_reproduction
  candidate_updates_per_rollout: 2
  budget_basis: 1000_successful_updates_plotted_horizon_candidate
  cadence_basis: public_common_every50_optimizer_updates
  semantic_gaps:
  - Prompt-major local groups replace historical DistributedKRepeatSampler shuffled mixed rows; exact order and RNG parity pending.
  - Model/reward revisions and text/LoRA asset conventions are release example pins, not recovered historical artifact hashes.
  - 1000 successful optimizer updates are the plotted-horizon training candidate; historical W&B indexing/overflow/overshoot parity is not certified.
  - EMA decay/refresh defaults are mapped from research 3ca2a36f; historical runtime implementations remain unresolved.
