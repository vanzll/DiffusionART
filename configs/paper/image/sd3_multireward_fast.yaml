# Source-mapped candidate, NOT certified execution of the archived runtime.
extends: ["sd3_geneval_fast.yaml","sd3_multireward_rewards.yaml","../geneval-assets.yaml"]
name: paper-sd3_multireward_fast-candidate
seed: 42
algorithm:
  name: flow_grpo_fast
  options:
    multi_reward_advantage:
      weights: {geneval: 0.25, pickscore: 0.25, clipscore: 0.25, hpsv2: 0.25}
      score_space: fixed_normalized
      eps: 0.0001
      renormalize_combined: false
    loss: {ratio_clip: 0.00001, advantage_clip: 5}
    updates_per_rollout: 2
    training_batches: 16
    shuffle_rows: false
    zero_advantage_mode: filter_pad
    max_empty_rollouts: 100
    evaluation_ema: {enabled: true, decay: 0.9, refresh: logical_batch}
model:
  name: sd3
  options:
    gradient_checkpointing: false
data:
  manifest: ${GENEVAL_TRAIN_MANIFEST}
  sha256: ${GENEVAL_TRAIN_SHA256}
  shuffle: true
sampling:
  steps: 10
  prompts_per_rollout: 48
  samples_per_prompt: 24
  microbatch: 9
  guidance_scale: 1
  height: 512
  width: 512
  options:
    shift: 3
    transition_kind: cps
    likelihood: mse
    noise_level: 0.8
    selection: contiguous
    pool: [0,1,2,3,4]
    count: 3
    logical_batch_size: 9
    unselected_noise: ode
training:
  max_updates: 1000
  learning_rate: 0.0003
  microbatch: 9
  precision: fp16
  allow_tf32: true
  grad_clip: 1
  optimizer: adamw
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  epsilon: 1.0e-08
evaluation:
  every_updates: 50
  at_updates: []
  manifest: ${GENEVAL_EVAL_MANIFEST}
  manifest_sha256: ${GENEVAL_EVAL_SHA256}
  sampling_steps: 40
  height: 512
  width: 512
  seed: 42
runtime:
  log: wandb
  output_dir: ${PAPER_OUTPUT_ROOT}/sd3_multireward_fast
  device: cuda
  distributed: ddp
  checkpoint_every: 200
  checkpoint_at_updates: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000]
provenance:
  kind: training_candidate_not_fullhistorical_reproduction
  candidate_updates_per_rollout: 2
  candidate_advantage_branch: joint_component_prompt_group_std
  budget_basis: 1000_successful_optimizer_updates_not_500_plot_truncation
  cadence_basis: public_common_every50_optimizer_updates
  dataset_contract: GenEval_full_prompt_train_with_structured_metadata
  reporting_scalar: GenEval+PickScore_logit/26+CLIPScore_logit/30+HPSv2.1_cosine
  semantic_gaps:
  - Actual archived baseline runtime commit source unavailable; the inspected canonical reference is not execution proof for this run.
  - Public asset pins, prompt-major sampling, RNG and text/LoRA conventions are not certified historical parity.
  - Candidate starts from base model weights; historical W&B indexing and successful-update/FP16 overflow parity are not certified.
  - Evaluation EMA decay and logical-batch refresh are mapped from the canonical reference, not recovered runtime state.
  - GenEval worker, scorer bundle and full structured data remain user-bound per docs/geneval.md; shared assets prepare five model snapshots only.
  - Logged Gaussian logprob label maps to negative MSE in the inspected canonical CPS branch; exact archived runtime transition source remains unavailable.
