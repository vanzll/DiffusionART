    - env: WAN_BASE_MODEL
      repo_id: Wan-AI/Wan2.1-I2V-14B-480P-Diffusers
      revision: b184e23a8a16b20f108f727c902e769e873ffc73
    - env: FLUX_REFERENCE_MODEL
      repo_id: black-forest-labs/FLUX.1-dev
      revision: 3de623fc3c33e44ffbe2bad470d0f45bccf2eb21
    - env: WAN_DISTILLED_SOURCE
      for_env: WAN_DISTILLED_TRANSFORMER
      repo_id: lightx2v/Wan2.1-I2V-14B-480P-StepDistill-CfgDistill-Lightx2v
      revision: fef288b326f4fed6d2983b9800c35363da31fcfe
      allow_patterns: [distill_models/distill_model.safetensors]
  prompts:
    - env: WAN_TRAIN_MANIFEST
