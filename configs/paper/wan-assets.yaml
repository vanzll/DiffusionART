      env: WAN_DISTILLED_TRANSFORMER
      source_env: WAN_DISTILLED_SOURCE
      source_file: distill_models/distill_model.safetensors
      config_env: WAN_BASE_MODEL
      config_file: transformer/config.json
      source_sha256: 12869d6856085d97cbf502fecbed85d1a67ce108174f95d82547497522479599
      revision: fef288b326f4fed6d2983b9800c35363da31fcfe
