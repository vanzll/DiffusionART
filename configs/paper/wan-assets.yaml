    WAN_BASE_REVISION: b184e23a8a16b20f108f727c902e769e873ffc73
    FLUX_REFERENCE_REVISION: 3de623fc3c33e44ffbe2bad470d0f45bccf2eb21
  snapshots:
    - env: VIDEO_REWARD_MODEL
      repo_id: KwaiVGI/VideoReward
      revision: 4f26600130683e6f1de9f5d463887f28e8ef995c
