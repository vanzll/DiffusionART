extends: wan_art_11.yaml
name: paper-wan-nft-ema-11
algorithm:
  name: diffusionnft
  options:
    old_policy: {mode: slow-ema, rate: 0.00125, maximum: 0.6}
    advantage_epsilon: 0.0001
    loss: {nft_beta: 1.0, adv_clip_max: 5.0, adv_mode: all, eps: 0.00001}
sampling:
  options:
    train_timestep_count: 4
    train_timestep_pool: [0, 1, 2, 3]
runtime:
  output_dir: ${PAPER_VIDEO_OUTPUT_ROOT}/wan-nft-ema-11
  checkpoint_every: 100
provenance:
  budget_basis: 400_global_optimizer_updates_400_rollouts
  artifact_policy: native_full_resume_checkpoint_every100_updates_all_scored_media
